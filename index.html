<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UlisesVeo | En Directo</title>
    <style>
        :root {
            --bg-color: #0e0e10;
            --panel-bg: #18181b;
            --text-color: #efeff1;
            --border-color: #26262c;
            --accent-hover: #3f3f46;
            --kick-color: #53fc18;
            --twitch-color: #9146ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-bg);
            padding: 10px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 55px;
            flex-shrink: 0;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1.05rem;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #eb0400;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px #eb0400;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Botones para alternar Kick / Twitch */
        .platform-selector {
            display: flex;
            background: #2d2d35;
            border-radius: 6px;
            padding: 2px;
        }

        .platform-btn {
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .platform-btn.active.kick {
            background: var(--kick-color);
            color: #000;
        }

        .platform-btn.active.twitch {
            background: var(--twitch-color);
            color: #fff;
        }

        .social-links {
            display: flex;
            gap: 8px;
        }

        .social-links a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.85rem;
            background: #2d2d35;
            padding: 6px 12px;
            border-radius: 4px;
            transition: background 0.2s;
            font-weight: 500;
        }

        .social-links a:hover {
            background: var(--accent-hover);
        }

        .main-container {
            display: flex;
            flex: 1;
            width: 100%;
            height: calc(100vh - 55px);
            overflow: hidden;
        }

        .player-container {
            flex: 3;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .chat-container {
            flex: 1;
            min-width: 320px;
            max-width: 400px;
            background: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 900px) {
            body {
                overflow: auto;
                height: auto;
            }

            header {
                flex-direction: column;
                height: auto;
                padding: 10px;
                gap: 10px;
            }

            .nav-controls {
                width: 100%;
                justify-content: space-between;
                flex-wrap: wrap;
            }

            .main-container {
                flex-direction: column;
                height: auto;
                overflow: visible;
            }

            .player-container {
                width: 100%;
                height: 56.25vw;
                min-height: 220px;
            }

            .video-wrapper {
                height: 100%;
            }

            .chat-container {
                width: 100%;
                max-width: 100%;
                height: 450px;
                border-left: none;
                border-top: 1px solid var(--border-color);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <span class="live-dot"></span>
            <span>ULISESVEO EN DIRECTO</span>
        </div>
        <div class="nav-controls">
            <!-- Selector de plataforma -->
            <div class="platform-selector">
                <button id="btn-kick" class="platform-btn active kick" onclick="switchPlatform('kick')">Kick</button>
                <button id="btn-twitch" class="platform-btn twitch" onclick="switchPlatform('twitch')">Twitch</button>
            </div>
            <!-- Redes y Apoyo -->
            <div class="social-links">
                <a href="https://www.youtube.com/channel/UCkWxfRIZDiAqRM8JL3Z6kng" target="_blank">YouTube</a>
                <a href="https://patreon.com/UlisesVeo?utm_medium=unknown&utm_source=join_link&utm_campaign=creatorshare_creator&utm_content=copyLink" target="_blank">Patreon 💛</a>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- Reproductor de Video -->
        <div class="player-container">
            <div class="video-wrapper">
                <iframe id="video-player" src="https://player.kick.com/UlisesVeo" allowfullscreen="true" scrolling="no"></iframe>
            </div>
        </div>

        <!-- Chat en Vivo -->
        <div class="chat-container">
            <iframe id="chat-iframe" src="https://kick.com/UlisesVeo/chatroom"></iframe>
        </div>
    </div>

    <script>
        function switchPlatform(platform) {
            const player = document.getElementById('video-player');
            const chat = document.getElementById('chat-iframe');
            const btnKick = document.getElementById('btn-kick');
            const btnTwitch = document.getElementById('btn-twitch');

            if (platform === 'kick') {
                player.src = 'https://player.kick.com/UlisesVeo';
                chat.src = 'https://kick.com/UlisesVeo/chatroom';
                btnKick.classList.add('active', 'kick');
                btnTwitch.classList.remove('active', 'twitch');
            } else {
                player.src = 'https://player.twitch.tv/?channel=UulisesV&parent=mi-streaming-web.vercel.app';
                chat.src = 'https://www.twitch.tv/embed/UulisesV/chat?darkpopout=true&parent=mi-streaming-web.vercel.app';
                btnTwitch.classList.add('active', 'twitch');
                btnKick.classList.remove('active', 'kick');
            }
        }
    </script>
</body>
</html>
